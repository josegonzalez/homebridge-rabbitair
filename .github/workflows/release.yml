name: Release

# Run this from the Actions tab ("Run workflow" on main) and pick patch, minor
# or major. The workflow bumps the version with `npm version`, publishes it to
# npm, and only then commits the bump to main, tags it and creates the GitHub
# release. A failed publish leaves no commit, tag or release behind.
#
# Homebridge installs and updates plugins from npmjs.com. Releases go to the
# npm "latest" dist-tag, which the Homebridge UI offers as an update.
#
# Security:
# - npm trusted publishing (OIDC): no npm token exists anywhere. npm only
#   accepts a publish from this repository, this workflow file and the "npm"
#   environment, and attaches a signed provenance statement.
# - Only the publish job can mint an OIDC token, and it runs no project code:
#   it publishes the tarball the build job made, after checking its checksum.
# - Only the final job can write to the repository, and it runs after the
#   publish succeeded.
# - Dependencies are installed from the lockfile with install scripts disabled,
#   and no dependency cache is used, so a poisoned cache cannot reach a release.
# - Actions are pinned to full commit SHAs.
#
# One-time setup is described in RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bump the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          current="$(node -p 'require("./package.json").version')"
          npm version "$BUMP" --no-git-tag-version --ignore-scripts > /dev/null
          version="$(node -p 'require("./package.json").version')"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::tag v$version already exists"
            exit 1
          fi
          published="$(npm view "$name@$version" version 2> /dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error::$name@$version is already on npm; set package.json on main to the latest released version"
            exit 1
          fi
          case "$version" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $name $current → $version ($BUMP) to the \`$tag\` dist-tag" >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci --ignore-scripts

      - run: npm run build

      # "prepare" only exists to build git installs. Published packages are
      # already built, and should not carry any install-time script.
      - name: Remove the git install build hook
        run: npm pkg delete scripts.prepare

      - run: node scripts/check-package.mjs --release

      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --json | node -p 'JSON.parse(require("fs").readFileSync(0))[0].filename')"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "$sha256  $tarball" > "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball ($sha256)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each release.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@josediazgonzalez/homebridge-rabbitair
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Verify the tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check --strict

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer; pin the version used.
      - run: npm install --global --ignore-scripts npm@11.21.3

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "./$TARBALL" --access public --provenance --tag "$DIST_TAG" --ignore-scripts

  commit-and-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials are kept only in this job, which pushes the release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Commit the version bump and tag it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: release $VERSION" package.json package-lock.json
          git tag --annotate "v$VERSION" --message "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          flags=()
          if [ "$DIST_TAG" = "beta" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/package/$TARBALL" "$RUNNER_TEMP/package/$TARBALL.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes \
            "${flags[@]}"

      # Last, because the version is already published and tagged by now. If
      # main moved during the release, merge the tag into main by hand.
      - name: Push the version bump to main
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! git push origin "HEAD:refs/heads/main"; then
            echo "::error::v$VERSION is published and tagged, but main could not be updated. Run: git fetch --tags && git merge v$VERSION && git push"
            exit 1
          fi
