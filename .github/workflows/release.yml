name: Release

# Publishes to npm when a GitHub release is published. Homebridge installs and
# updates plugins from npmjs.com, so the npm dist-tag decides who gets a
# version: stable releases go to "latest", which the Homebridge UI offers as an
# update, and pre-releases (for example v1.2.0-beta.1) go to "beta", which users
# can pick from the plugin's version list in the Homebridge UI.
#
# Security:
# - npm trusted publishing (OIDC): no npm token exists anywhere. npm only
#   accepts a publish from this repository, this workflow file and the "npm"
#   environment, and attaches a signed provenance statement.
# - Only the publish job can mint an OIDC token, and it runs no project code:
#   it publishes the tarball the build job made, after checking its checksum.
# - Dependencies are installed from the lockfile with install scripts disabled,
#   and no dependency cache is used, so a poisoned cache cannot reach a release.
# - Actions are pinned to full commit SHAs.
#
# One-time setup is described in RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the release tag matches package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag $TAG does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          if [ "$PRERELEASE" = "true" ] && [ "$tag" = "latest" ]; then
            echo "::error::a pre-release needs a pre-release version such as $version-beta.1"
            exit 1
          fi
          if [ "$PRERELEASE" != "true" ] && [ "$tag" = "beta" ]; then
            echo "::error::version $version is a pre-release; mark the GitHub release as a pre-release"
            exit 1
          fi
          echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci --ignore-scripts

      - run: npm run build

      # "prepare" only exists to build git installs. Published packages are
      # already built, and should not carry any install-time script.
      - name: Remove the git install build hook
        run: npm pkg delete scripts.prepare

      - run: node scripts/check-package.mjs --release

      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --json | node -p 'JSON.parse(require("fs").readFileSync(0))[0].filename')"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "$sha256  $tarball" > "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball ($sha256)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each release.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@josediazgonzalez/homebridge-rabbitair
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Verify the tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$SHA256  $TARBALL" | sha256sum --check --strict

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer; pin the version used.
      - run: npm install --global --ignore-scripts npm@11.21.3

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "./$TARBALL" --access public --provenance --tag "$DIST_TAG" --ignore-scripts

  attach:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Attach the published tarball and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --repo "$GITHUB_REPOSITORY" --clobber
